name: bullseye2d
description: A cross-platform 2D game library for Dart that supports a WebGL2 backend as well as native support for Windows, Mac and Linux via SDL3.
version: 2.0.4
repository: https://github.com/bullseye2d/bullseye2d

executables:
  bullseye2d: bullseye2d

environment:
  sdk: ^3.7.2

dependencies:
  args: ^2.7.0
  ffi: ^2.2.0
  http: ^1.6.0
  path: ^1.9.1
  sdl3: ^2.9.0
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  vector_math: ^2.4.0
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.15.0
  build_web_compilers: ^4.8.0
  lints: ^5.1.1
  test: ^1.31.1

